name: CodeIslandCompanion
options:
  bundleIdPrefix: com.revopsglobal
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: "44JG2Y95CH"
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: "4"
    MARKETING_VERSION: "1.0.0"
targets:
  CodeIslandCompanion:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: CodeIslandCompanion
        excludes:
          - WatchBridge.swift
      - path: Shared
      - path: ../../Sources/CodeIslandCore/RemoteApprovalProtocol.swift
      - path: ../../Sources/CodeIslandCore/LiveActivityLifecycle.swift
      - path: ../../Sources/CodeIslandCore/PersonalHubProtocol.swift
      - path: ../../Sources/CodeIsland/AntiGravityView.swift
      - path: ../../Sources/CodeIsland/BuddyView.swift
      - path: ../../Sources/CodeIsland/ClineView.swift
      - path: ../../Sources/CodeIsland/CopilotView.swift
      - path: ../../Sources/CodeIsland/CursorView.swift
      - path: ../../Sources/CodeIsland/DexView.swift
      - path: ../../Sources/CodeIsland/DroidView.swift
      - path: ../../Sources/CodeIsland/GeminiView.swift
      - path: ../../Sources/CodeIsland/HermesView.swift
      - path: ../../Sources/CodeIsland/KimiView.swift
      - path: ../../Sources/CodeIsland/MascotMotion.swift
      - path: ../../Sources/CodeIsland/MascotTimeline.swift
      - path: ../../Sources/CodeIsland/OpenCodeView.swift
      - path: ../../Sources/CodeIsland/PixelCharacterView.swift
      - path: ../../Sources/CodeIsland/QoderView.swift
      - path: ../../Sources/CodeIsland/QwenView.swift
      - path: ../../Sources/CodeIsland/StepFunView.swift
      - path: ../../Sources/CodeIsland/TraeView.swift
      - path: ../../Sources/CodeIsland/WorkBuddyView.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.revopsglobal.codeisland.buddy
        INFOPLIST_FILE: CodeIslandCompanion/Info.plist
        CODE_SIGN_ENTITLEMENTS: CodeIslandCompanion/CodeIslandCompanion.entitlements
        APS_ENVIRONMENT: development
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
      configs:
        Release:
          APS_ENVIRONMENT: production
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "iPhone Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "CodeIsland Buddy App Store"
    dependencies:
      - target: CodeIslandCompanionWidget
        embed: true
      - sdk: AppIntents.framework
      - sdk: Speech.framework
  CodeIslandCompanionWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: CodeIslandCompanionWidget
      - path: Shared
      - path: ../../Sources/CodeIsland/AntiGravityView.swift
      - path: ../../Sources/CodeIsland/BuddyView.swift
      - path: ../../Sources/CodeIsland/ClineView.swift
      - path: ../../Sources/CodeIsland/CopilotView.swift
      - path: ../../Sources/CodeIsland/CursorView.swift
      - path: ../../Sources/CodeIsland/DexView.swift
      - path: ../../Sources/CodeIsland/DroidView.swift
      - path: ../../Sources/CodeIsland/GeminiView.swift
      - path: ../../Sources/CodeIsland/HermesView.swift
      - path: ../../Sources/CodeIsland/KimiView.swift
      - path: ../../Sources/CodeIsland/MascotMotion.swift
      - path: ../../Sources/CodeIsland/MascotTimeline.swift
      - path: ../../Sources/CodeIsland/OpenCodeView.swift
      - path: ../../Sources/CodeIsland/PixelCharacterView.swift
      - path: ../../Sources/CodeIsland/QoderView.swift
      - path: ../../Sources/CodeIsland/QwenView.swift
      - path: ../../Sources/CodeIsland/StepFunView.swift
      - path: ../../Sources/CodeIsland/TraeView.swift
      - path: ../../Sources/CodeIsland/WorkBuddyView.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.revopsglobal.codeisland.buddy.widget
        INFOPLIST_FILE: CodeIslandCompanionWidget/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
        SKIP_INSTALL: YES
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "iPhone Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "CodeIsland Buddy Widget App Store"
  CodeIslandCompanionUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: CodeIslandCompanionUITests
      - path: CodeIslandCompanion/StandByLayout.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.revopsglobal.codeisland.buddy.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: CodeIslandCompanion
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - target: CodeIslandCompanion
  CodeIslandCompanionTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: CodeIslandCompanionTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.revopsglobal.codeisland.buddy.tests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - target: CodeIslandCompanion
schemes:
  CodeIslandCompanion:
    build:
      targets:
        CodeIslandCompanion: all
        CodeIslandCompanionWidget: all
        CodeIslandCompanionUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CodeIslandCompanionTests
        - CodeIslandCompanionUITests
